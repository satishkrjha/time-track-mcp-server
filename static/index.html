<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TimeTrack</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">TT</div>
      <div>
        <h1>TimeTrack</h1>
        <p class="tagline">Time entries logged here, or by an AI assistant, land in the same place.</p>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="entries">All Entries</button>
    <button class="tab" data-view="summary">Project Summary</button>
    <button class="tab" data-view="reports">Weekly Report</button>
    <button class="tab" data-view="dashboard">Monthly Dashboard</button>
    <button class="tab" data-view="log">Log Time</button>
  </nav>

  <main>
    <div id="toast" class="toast" aria-live="polite"></div>

    <section id="view-entries" class="view active">
      <div id="editEntryForm" class="edit-entry-form hidden">
        <input id="editEntryId" type="hidden">
        <input id="editEmployeeInput" type="text" placeholder="Employee name">
        <input id="editProjectInput" type="text" placeholder="Project">
        <input id="editDateInput" type="date">
        <input id="editHoursInput" type="number" step="0.25" placeholder="Hours">
        <input id="editDescInput" type="text" placeholder="Description">
        <button id="saveEditBtn" type="button">Save Changes</button>
        <button id="cancelEditBtn" type="button" class="secondary-btn">Cancel</button>
      </div>

      <div class="entries-controls">
        <input id="employeeFilter" type="text" placeholder="Employee name">
        <input id="projectFilter" type="text" placeholder="Project">
        <input id="startDateFilter" type="date">
        <input id="endDateFilter" type="date">
        <button id="loadEntriesBtn" type="button">Load Entries</button>
        <button id="exportCsvBtn" type="button" class="secondary-btn">Export CSV</button>
        <input id="importCsvInput" type="file" accept=".csv,text/csv">
        <button id="importCsvBtn" type="button" class="secondary-btn">Import CSV</button>
      </div>
      <table id="entriesTable">
        <thead>
          <tr><th>Date</th><th>Employee</th><th>Project</th><th>Hours</th><th>Description</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="view-summary" class="view">
      <div class="summary-controls">
        <select id="projectSelect"></select>
        <button id="loadSummaryBtn">Load Summary</button>
      </div>
      <div class="summary-controls">
        <input id="projectBudgetInput" type="number" step="0.5" placeholder="Budget hours">
        <button id="setBudgetBtn" type="button">Set Project Budget</button>
      </div>
      <div id="summaryResult"></div>
      <div id="projectAlerts" class="project-alerts"></div>
    </section>

    <section id="view-reports" class="view">
      <div class="summary-controls">
        <input id="employeeReportInput" type="text" placeholder="Employee name">
        <input id="weekStartInput" type="date">
        <button id="loadReportBtn">Load Weekly Report</button>
      </div>
      <div id="reportResult"></div>
    </section>

    <section id="view-dashboard" class="view">
      <div class="summary-controls">
        <input id="monthDashboardInput" type="month">
        <button id="loadDashboardBtn">Load Monthly Summary</button>
      </div>
      <div id="dashboardResult"></div>
    </section>

    <section id="view-log" class="view">
      <form id="logForm">
        <input id="employeeInput" type="text" placeholder="Employee name" required>
        <input id="projectInput" type="text" placeholder="Project" required>
        <input id="dateInput" type="date" required>
        <input id="hoursInput" type="number" step="0.25" placeholder="Hours" required>
        <input id="descInput" type="text" placeholder="Description">
        <button type="submit">Log Time</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Same database, two front doors -- this page, and any MCP-connected AI assistant.</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
